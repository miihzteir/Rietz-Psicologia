/* Firebase: login Google + nuvem compartilhada entre as contas autorizadas */
window.fbReady=new Promise(res=>{window.__fbResolve=res});
(function(){
  const cfg=window.FIREBASE_CONFIG,allow=(window.CONTAS_AUTORIZADAS||[]).map(x=>x.toLowerCase().trim());

  if(!cfg||!cfg.apiKey||!window.firebase){set("nocfg");window.__fbResolve(null);return}
  firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore();window.fbAuth=auth;
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  let resolved=false,denied=null;
  auth.getRedirectResult().catch(e=>set("error",{err:fbErr(e)}));
  auth.onAuthStateChanged(u=>{
    if(!u){if(denied){const d=denied;denied=null;set("denied",d)}else set("out");return}
    const em=(u.email||"").toLowerCase();
    if(!allow.includes(em)){denied={email:u.email,name:u.displayName||"",avatar:u.photoURL||""};auth.signOut();return}
    set("ok",{email:u.email,name:u.displayName||"",avatar:u.photoURL||""});
    if(!resolved){resolved=true;window.__fbResolve(db)}
  });
  window.fbErr=e=>({"auth/unauthorized-domain":"Este endereço ainda não está autorizado no Firebase (Authentication > Configurações > Domínios autorizados).","auth/popup-closed-by-user":"A janela do Google foi fechada antes de terminar.","auth/network-request-failed":"Sem internet. Confira a conexão e tente de novo.","auth/operation-not-allowed":"O login com Google ainda não foi ativado no Firebase.","auth/web-storage-unsupported":"O navegador está bloqueando o armazenamento. Desative a navegação anônima ou o bloqueio de cookies e tente de novo.","auth/internal-error":"O Google não respondeu. Feche e abra o app de novo e tente outra vez.","auth/too-many-requests":"Muitas tentativas seguidas. Espere um minuto e tente de novo."}[e&&e.code]||("Não consegui entrar: "+((e&&e.message)||"erro desconhecido")));
  const inApp=/FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)|WebView|GSA\//i.test(navigator.userAgent);
  window.fbSignIn=async()=>{
    if(inApp){set("error",{err:"Este navegador interno não permite entrar com Google. Abra o endereço no Chrome ou no Safari."});return}

    catch(e){const c=e&&e.code;
      if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"||c==="auth/web-storage-unsupported"){try{await auth.signInWithRedirect(p);return}catch(x){set("error",{err:fbErr(x)});return}}

      set("error",{err:fbErr(e)})}};

<style>
/* Layout: moldura creme sobre fundo malva, sidebar à esquerda, grade de painéis rosados no centro e trilho de anéis escuros à direita */
:root{
  --outer:#CDB6C8; --frame:#F7EFE8; --side:#EFE2E0; --panel:#E9D6DC; --pill:#F8EEEB; --line:#DCC5CE;
  --rail:#8D6B84; --rail-in:#A8879E; --ink:#45343F; --soft:#7E6977; --faint:#AC97A5;
  --rose:#D8667F; --sage:#7FAAA5; --gold:#E2A93F; --plum:#6E4B67; --ok:#4F9271; --warn:#B87A1F; --bad:#BF4D66;
  --onrail:#FBF3F6; --shadow:0 18px 50px -24px rgba(90,55,80,.45);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --outer:#1C151A; --frame:#271E25; --side:#2F242C; --panel:#3A2D37; --pill:#32262F; --line:#4A3A46;
  --rail:#5B4255; --rail-in:#775C70; --ink:#F2E6EC; --soft:#C6B2BF; --faint:#8E7887;
  --rose:#EC8299; --sage:#9CC6C1; --gold:#F0C467; --plum:#E3BCD7; --ok:#7FC09E; --warn:#E6AE58; --bad:#E57D93;
  --onrail:#FBF3F6; --shadow:0 18px 50px -24px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --outer:#1C151A; --frame:#271E25; --side:#2F242C; --panel:#3A2D37; --pill:#32262F; --line:#4A3A46;
  --rail:#5B4255; --rail-in:#775C70; --ink:#F2E6EC; --soft:#C6B2BF; --faint:#8E7887;
  --rose:#EC8299; --sage:#9CC6C1; --gold:#F0C467; --plum:#E3BCD7; --ok:#7FC09E; --warn:#E6AE58; --bad:#E57D93;
  --onrail:#FBF3F6; --shadow:0 18px 50px -24px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--outer);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:1320px;margin:0 auto;background:var(--frame);border-radius:30px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:224px minmax(0,1fr);overflow:hidden;overflow:clip;min-height:calc(100vh - 48px)}

/* sidebar */
.side{background:var(--side);padding:28px 14px 22px;display:flex;flex-direction:column;gap:20px;position:sticky;top:24px;align-self:start;height:calc(100vh - 48px);height:calc(100dvh - 48px);overflow:hidden}
.side>*{flex:none}
@media (min-width:861px){.app{background:linear-gradient(90deg,var(--side) 224px,var(--frame) 224px)}}
.brand{font-family:var(--display);font-size:23px;font-weight:500;letter-spacing:-.01em;padding:0 10px;line-height:1.15}
.brand,.mbrand{display:flex;align-items:center;gap:11px}
.bmark{width:44px;height:44px;border-radius:14px;background:var(--rail);color:var(--onrail);display:grid;place-items:center;flex:none;box-shadow:0 8px 18px -12px rgba(90,55,80,.7)}
.bmark svg{width:32px;height:32px}
.btxt{display:flex;flex-direction:column;line-height:1}
#brandName,.bname{text-transform:lowercase;font-family:var(--display);font-weight:400;font-size:25px;letter-spacing:.01em;color:var(--ink)}
.btxt small{margin-top:5px}
.mbrand{display:none}
.mday{display:none}
.brand small,.mbrand small{display:block;font-family:var(--ui);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.me{display:flex;align-items:center;gap:12px;padding:0 10px}
.avatar{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--sage),var(--rail));
  display:grid;place-items:center;color:var(--onrail);font-family:var(--display);font-size:21px;flex:none}
.me div{min-width:0}
.me b{display:block;font-weight:600;line-height:1.25}
.me small{display:block;color:var(--soft);font-size:12px;line-height:1.35}
.me .crp{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--plum);background:var(--frame);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1 1 auto!important;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -4px;padding:0 4px}
.nav button{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;text-align:left;color:var(--soft);font-weight:500}
.nav button:hover{background:var(--pill);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--frame);color:var(--ink);font-weight:600;box-shadow:0 4px 14px -10px rgba(90,55,80,.5)}
.nav svg{width:18px;height:18px;flex:none}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--rose);color:var(--onrail);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.side .spacer{display:none}
@media (max-height:860px) and (min-width:861px){.side{padding:20px 12px 16px;gap:14px}.nav{gap:1px}.nav button{padding:7px 12px}.me .avatar{width:42px;height:42px}.brand .bmark{width:38px;height:38px}.brand .bmark svg{width:28px;height:28px}}
@media (max-height:700px) and (min-width:861px){.nav button{padding:5px 12px;font-size:13px}.me small{display:none}.me .crp{margin-top:2px}}
.side .foot{font-size:12px;color:var(--soft);padding:0 12px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on::before{background:var(--ok)}
.sync.local::before{background:var(--warn)}

/* main */
.main{padding:28px 28px 32px;min-width:0;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hello{flex:1;min-width:220px}
.hello h1{font-family:var(--display);font-weight:500;font-size:clamp(26px,3vw,34px);margin:0;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.hello p{margin:4px 0 0;color:var(--soft)}
.search{position:relative;width:min(320px,100%)}
.search input{width:100%;padding:11px 16px 11px 40px;border-radius:999px;border:1px solid var(--line);background:var(--pill);outline:none}
.search input:focus{border-color:var(--rose)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--soft)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--frame);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:6px;z-index:20;max-height:340px;overflow:auto}
.results button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:10px}
.results button:hover{background:var(--pill)}
.results small{color:var(--soft);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.results .rgrp{margin:8px 10px 2px;font-size:11px;font-weight:700;color:var(--plum);letter-spacing:.08em;text-transform:uppercase}
.results .rgrp:first-child{margin-top:4px}
.results button{overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--rail);color:var(--onrail);font-weight:600;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn svg{width:16px;height:16px}
.btn.ghost{background:var(--pill);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{background:var(--bad)}
.banner{background:var(--pill);border:1px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:200px;color:var(--soft)}
.banner b{color:var(--ink)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}

.panel{background:var(--panel);border-radius:22px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;align-items:center;gap:8px;min-width:0}
.ph{flex-wrap:wrap}
.ph h2{font-size:15px;font-weight:600;margin:0;flex:1 0 auto;white-space:nowrap}
.ph .meta{font-size:12px;color:var(--soft);white-space:nowrap}
.add{width:30px;height:30px;border-radius:50%;background:var(--frame);display:grid;place-items:center;color:var(--plum);font-size:18px;line-height:1;border:1px solid var(--line);flex:none}
.add:hover{background:var(--rail);color:var(--onrail)}
.more{align-self:flex-end;font-size:12.5px;color:var(--soft);font-weight:600;margin-top:auto}
.more:hover{color:var(--ink)}
.sub{margin:0;font-size:12px;color:var(--soft);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--pill);border:1px solid var(--line);border-radius:18px;padding:8px 10px;min-width:0;text-align:left;width:100%}
button.row:hover{border-color:var(--rail-in)}
.row .txt{flex:1;min-width:0;text-align:left}
.row .txt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:600;font-size:13.5px;line-height:1.3;overflow:hidden;overflow-wrap:anywhere}
.row .txt small{display:block;color:var(--soft);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .txt b{text-decoration:line-through;color:var(--faint)}
.row{flex-wrap:wrap;row-gap:6px}
.row .txt{flex:1 1 140px}
.row .end{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}
.row .txt .nm{display:block;text-align:left;max-width:100%}
.row .txt .nm:hover b{text-decoration:underline}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.time{width:46px;flex:none;text-align:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;color:var(--plum);line-height:1.15}
.time small{display:block;font-weight:500;font-size:10.5px;color:var(--soft)}
.ini{width:34px;height:34px;border-radius:50%;background:var(--rail);color:var(--onrail);display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}
.ini svg{width:17px;height:17px}
.ini.big{width:56px;height:56px;font-size:20px;font-family:var(--display);font-weight:500}
.bubble{width:40px;height:40px;border-radius:50%;background:var(--frame);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:17px;flex:none;line-height:1}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--rail-in);flex:none;display:grid;place-items:center}
.check.on{background:var(--rail);border-color:var(--rail)}
.check.on::after{content:"";width:9px;height:5px;border:2px solid var(--onrail);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.icon-btn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--soft);flex:none}
.icon-btn:hover{background:var(--frame);color:var(--ink)}
.icon-btn svg{width:15px;height:15px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em;flex:none;white-space:nowrap;line-height:1.4}
.t-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.t-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.t-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.t-mute{background:color-mix(in srgb,var(--faint) 22%,transparent);color:var(--soft)}
.t-plum{background:color-mix(in srgb,var(--rail) 20%,transparent);color:var(--plum)}
button.tag:hover{filter:brightness(.95)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:16px;color:var(--soft);font-size:13px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}

/* calendário */
.sched{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px}
.cal{background:var(--pill);border:1px solid var(--line);border-radius:18px;padding:10px 10px 12px;align-self:start}
.calh{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13.5px;margin-bottom:6px}
.calh button{width:30px;height:30px;border-radius:50%;color:var(--soft);font-size:16px}
.calh button:hover{background:var(--panel)}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cg .wd{font-size:11px;color:var(--soft);font-weight:600;padding:2px 0}
.cg button{height:36px;width:36px;max-width:100%;margin:0 auto;border-radius:50%;font-size:13px;position:relative;font-variant-numeric:tabular-nums}
.cg button:hover{background:var(--panel)}
.cg button.out{color:var(--faint)}
.cg button.today{background:var(--rail);color:var(--onrail);font-weight:700}
.cg button.sel:not(.today){box-shadow:inset 0 0 0 2px var(--rail-in)}
.cg button.has::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--rose)}
.cg button.today.has::after{background:var(--onrail)}
.cg button.hast::after{background:var(--sage)}
.row.afz{background:color-mix(in srgb,var(--sage) 12%,var(--pill))}
.row.afz .time{color:var(--ok)}
.row.sup2{background:color-mix(in srgb,var(--rail) 10%,var(--pill))}
.time .dia{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:inherit;display:block}
.daylist{display:flex;flex-direction:column;gap:8px;min-width:0}

/* hábitos */
.hab{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,26px) 34px;gap:6px;align-items:center}
.hab .hn{font-weight:600;font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25;text-align:left;overflow-wrap:anywhere}
.hab .wd{font-size:11px;color:var(--soft);text-align:center;font-weight:600}
.hab .wd.t{color:var(--rose)}
.hd{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line);background:var(--pill)}
.hd.on{background:var(--sage);border-color:var(--sage)}
.hd.fut{opacity:.4;cursor:default}
.hd.t{border-color:var(--rail-in)}
.streak{font-size:11.5px;color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}

/* números */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--pill);border:1px solid var(--line);border-radius:14px;padding:9px 11px;min-width:0}
.stat small{display:block;font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in{color:var(--ok)}.out{color:var(--bad)}.pend{color:var(--warn)}
.money{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;white-space:nowrap}

/* notas */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.note{background:var(--pill);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px;position:relative;min-width:0}
.note b{font-size:13px;padding-right:18px;overflow-wrap:anywhere}
.note p{margin:0;font-size:12.5px;color:var(--soft);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.note .pin{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--rose)}
.note.nc1{background:color-mix(in srgb,var(--rose) 14%,var(--pill))}
.note.nc2{background:color-mix(in srgb,var(--sage) 22%,var(--pill))}
.note.nc3{background:color-mix(in srgb,var(--gold) 18%,var(--pill))}

/* trilho */
.rail{background:var(--panel);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:12px}
.ring{background:var(--rail);border-radius:20px;padding:14px 12px 16px;color:var(--onrail);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.ring h3{margin:0;font-size:13px;font-weight:600;opacity:.95}
.ring svg{width:104px;height:104px}
.ring small{font-size:12px;opacity:.9;font-variant-numeric:tabular-nums}
.box{background:var(--pill);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h3{margin:0;font-size:13px;font-weight:600}
.box .hint{margin:0;color:var(--soft);font-size:12.5px}
.mix{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--panel)}
.mix i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px;color:var(--soft)}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.legend b{color:var(--ink);margin-left:auto;font-variant-numeric:tabular-nums}

/* telas */
.view{display:flex;flex-direction:column;gap:18px}
.vh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vh h1{font-family:var(--display);font-weight:500;font-size:28px;margin:0;flex:1;min-width:180px;line-height:1.2}
.vh h2{margin:0;font-size:17px;flex:1;min-width:180px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:var(--pill);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--rail);color:var(--onrail);border-color:var(--rail)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--soft);font-weight:600;font-size:13px;align-self:flex-start}
.back svg{width:16px;height:16px}
.back:hover{color:var(--ink)}
.phead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.phead .who{flex:1;min-width:200px}
.phead h1{font-family:var(--display);font-weight:500;font-size:26px;margin:0;line-height:1.2;overflow-wrap:anywhere}
.phead p{margin:6px 0 0;color:var(--soft);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.info div{background:var(--pill);border:1px solid var(--line);border-radius:14px;padding:9px 12px;min-width:0}
.info small{display:block;font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.info span{display:block;font-weight:600;overflow-wrap:anywhere}
.info .wide{grid-column:1/-1}
.info .wide span{font-weight:500;white-space:pre-wrap}
.tl{display:flex;flex-direction:column;gap:10px}
.rec{background:var(--pill);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rec .rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec .rh b{flex:1;min-width:140px}
.rec p{margin:0;white-space:pre-wrap;color:var(--ink);font-size:13.5px;overflow-wrap:anywhere}
.rec p.mute{color:var(--faint);font-style:italic}
.tabs{display:flex;gap:4px;background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:4px;align-self:flex-start;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none}
.tabs button{padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--soft)}
.tabs button[aria-pressed="true"]{background:var(--rail);color:var(--onrail)}
.monthnav{display:flex;align-items:center;gap:8px;font-weight:600}
.monthnav button:not(.btn){width:34px;height:34px;flex:none;border-radius:50%;background:var(--pill);border:1px solid var(--line);font-size:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch}
.plan{background:var(--pill);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.plan b{font-size:15px}
.plan .pv{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.plan .pv small{font-family:var(--ui);font-size:13px;color:var(--soft)}
.plan > small{color:var(--soft)}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}

/* relatórios e escalas */
.hb{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hb > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hb .tr{height:10px;background:var(--pill);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.hb .tr i{display:block;height:100%;background:var(--rail-in);border-radius:99px}
.hb .v{font-variant-numeric:tabular-nums;color:var(--soft);white-space:nowrap;text-align:right;min-width:64px}
.tblw{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--pill)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;min-width:460px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:700;background:var(--panel)}
.scard{background:var(--pill);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.scard .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scard .sh b{flex:1;min-width:140px}
.scard .big{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.chart svg{width:100%;height:auto;display:block}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{padding:5px 10px;border-radius:999px;border:1px dashed var(--rail-in);font-size:12.5px;font-weight:600;color:var(--plum);font-variant-numeric:tabular-nums;background:transparent}
.slot:hover{background:var(--rail);color:var(--onrail);border-style:solid}
.slot.match{border-style:solid;background:color-mix(in srgb,var(--rail) 14%,transparent)}
.rcpt{background:#fff;color:#3a2b35;border-radius:14px;padding:18px;border:1px solid var(--line);font-size:13px;line-height:1.55;display:flex;flex-direction:column;gap:10px}
.rcpt .rt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid #e6d7de;padding-bottom:8px}
.rcpt .rt b{font-family:var(--display);font-size:20px;font-weight:500;color:#6E4B67}
.rcpt .val{font-weight:700;font-size:15px;color:#6E4B67}
.rcpt .sig{margin-top:14px;text-align:center;border-top:1px solid #b9a5b0;padding-top:6px;font-size:12px}
.rcpt small{color:#7e6977}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,var(--pill));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.warnbox p{margin:0;flex:1;min-width:200px;font-size:13px}
.wdays{display:flex;gap:6px;flex-wrap:wrap}
.wdays label{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--pill)}
.ph2{display:flex;align-items:center;gap:8px}
.row .txt small.last{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-style:italic;margin-top:2px}
.btn.small svg{width:13px;height:13px}
.mday{margin-left:auto}
.mday svg{width:14px;height:14px}
.carebox{background:color-mix(in srgb,var(--bad) 10%,var(--pill));border:1px solid color-mix(in srgb,var(--bad) 30%,var(--line));border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.carebox b{color:var(--bad)}
.carebox p{margin:0;font-size:13px;white-space:pre-wrap;flex:1}
.pacts2{display:flex;gap:6px;flex-wrap:wrap}
.hero{background:var(--rail);color:var(--onrail);border-radius:22px;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .hl{flex:1;min-width:200px}
.hero small{opacity:.85;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.hero h2{margin:4px 0 2px;font-family:var(--display);font-weight:500;font-size:26px;line-height:1.15}
.hero p{margin:0;opacity:.9}
.hero .cd{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.hero .btn{background:var(--onrail);color:var(--plum)}
.tline{display:flex;flex-direction:column;gap:0;position:relative}
.tev{display:grid;grid-template-columns:86px 14px minmax(0,1fr);gap:10px;align-items:start;padding:6px 0}
.tev .td{font-size:12px;color:var(--soft);text-align:right;font-variant-numeric:tabular-nums;padding-top:2px}
.tev .tdot{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--c,var(--rail-in));box-shadow:0 0 0 3px var(--pill)}
.tev .tx{background:var(--pill);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-width:0}
.tev .tx b{font-size:13px}.tev .tx p{margin:2px 0 0;font-size:12.5px;color:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tline::before{content:"";position:absolute;left:102px;top:8px;bottom:8px;width:2px;background:var(--line)}
mark{background:color-mix(in srgb,var(--gold) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.hw{display:flex;gap:8px;align-items:center;background:var(--pill);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.hw .t{flex:1;min-width:0;font-size:13px}
.hw .t small{display:block;color:var(--soft);font-size:11.5px}
.cg button.blkd{background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--rail-in) 30%,transparent) 4px 6px);color:var(--soft)}
.live{position:fixed;inset:0;z-index:55;background:var(--frame);overflow:auto;padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.live .lw{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.live .lh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.live .lh h1{margin:0;font-family:var(--display);font-weight:500;font-size:28px;flex:1;min-width:180px;line-height:1.15}
.timer{background:var(--rail);color:var(--onrail);border-radius:22px;padding:16px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.timer .tt{font-family:var(--display);font-size:46px;font-variant-numeric:tabular-nums;line-height:1}
.timer .tb{flex:1;min-width:160px}
.timer .bar2{height:10px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:8px}
.timer .bar2 i{display:block;height:100%;border-radius:99px;background:var(--onrail);transition:width 1s linear}
.timer.warn .bar2 i{background:var(--gold)}.timer.over .bar2 i{background:var(--rose)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
.live textarea{min-height:46vh}
.livepill{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--rail);color:var(--onrail);border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.livepill::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--rose);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.gate{z-index:95!important}
.gear{position:relative;width:42px;height:42px;border-radius:50%;background:var(--pill);border:1px solid var(--line);display:grid;place-items:center;color:var(--plum);flex:none}
.gear svg{width:20px;height:20px}
.gear::after{content:"";position:absolute;right:1px;top:1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--frame);background:var(--faint)}
.gear[data-s="on"]::after{background:var(--ok)}.gear[data-s="saving"]::after{background:var(--gold)}.gear[data-s="local"]::after{background:var(--warn)}
@media (prefers-reduced-motion:no-preference){.gear:hover svg{transform:rotate(60deg)}.gear svg{transition:transform .5s var(--ease)}}
.mbrand .gear{width:38px;height:38px}
.avatar{background-size:cover;background-position:center}
.av{border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--sage),var(--rail));background-size:cover;background-position:center;color:var(--onrail);display:grid;place-items:center;font-family:var(--display);flex:none}
.acct{display:flex;align-items:center;gap:14px;background:var(--pill);border:1px solid var(--line);border-radius:18px;padding:14px}
.acct .who{flex:1;min-width:0}.acct b{display:block;font-size:15px}.acct small{display:block;color:var(--soft);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.syncbox{display:flex;flex-direction:column;gap:2px;border-radius:16px;padding:12px 14px 12px 34px;position:relative;border:1px solid var(--line);background:var(--pill)}
.syncbox::before{content:"";position:absolute;left:14px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--faint)}
.syncbox.on::before{background:var(--ok)}.syncbox.saving::before{background:var(--gold)}.syncbox.local::before{background:var(--warn)}
.syncbox small{color:var(--soft);font-size:12.5px}
.sync.saving::before{background:var(--gold)}
.gate .card{background:var(--pill);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.gate .card small{display:block;color:var(--soft);font-size:12px}
.gate .btn{width:100%;padding:13px 18px;font-size:15px}
.lock{position:fixed;inset:0;z-index:90;background:var(--frame);display:grid;place-items:center;padding:24px}
.lock .lk{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;width:min(320px,100%)}
.lock .bmark{width:72px;height:72px;border-radius:22px}.lock .bmark svg{width:52px;height:52px}
.lock h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;text-transform:lowercase}
.lock p{margin:0;color:var(--soft)}
.dots{display:flex;gap:12px;min-height:16px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--rail-in)}.dots i.on{background:var(--rail);border-color:var(--rail)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:6px}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--pill);border:1px solid var(--line);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--rail);color:var(--onrail);transform:scale(.92)}
.shake{animation:shake .4s}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lock input{text-align:center}
body.modal{overflow:hidden}
.dpick input,.inl{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--pill);font-size:13px;outline:none;min-width:0;font-variant-numeric:tabular-nums}
.dpick input:focus,.inl:focus{border-color:var(--rose)}
.mlbl{position:relative;cursor:pointer;padding:4px 10px;border-radius:10px}
.mlbl:hover{background:var(--panel)}
.mlbl input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.emerg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--bad) 8%,var(--pill));border:1px solid color-mix(in srgb,var(--bad) 25%,var(--line));border-radius:14px;padding:9px 12px}
.emerg small{display:block;font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.emerg .who2{flex:1;min-width:160px}
.emerg b{font-weight:600}
.emerg .ph{user-select:all;font-variant-numeric:tabular-nums}

/* modal */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--outer) 70%,transparent);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--frame);border-radius:24px;width:min(520px,100%);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.sheet h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0}
.sheet .hint{margin:0;font-size:12.5px;color:var(--soft)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--soft)}
.field input,.field select,.field textarea{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--pill);outline:none;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rose)}
.field textarea{min-height:110px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px}
.chk input{width:18px;height:18px;accent-color:var(--rail)}
.fsec{margin:6px 0 0;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--plum)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.actions .left{margin-right:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--rail);color:var(--onrail);padding:10px 18px;border-radius:999px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

.tabbar{display:none}
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr);align-items:stretch}
  .rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .rail .box{grid-column:span 3}
}
@media (max-width:860px){
  body{padding-block:0;padding-left:0;padding-right:0}
  .app{grid-template-columns:minmax(0,1fr);border-radius:0;min-height:100vh;box-shadow:none}
  .side{display:none}
  .main{padding:18px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .layout{display:flex;flex-direction:column}
  .grid{grid-template-columns:minmax(0,1fr)}
  .s2,.s3,.s4,.s6{grid-column:auto}
  .sched,.two{grid-template-columns:minmax(0,1fr)}
  .rail{order:-1;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px}
  .ring{padding:10px 4px 12px;gap:4px}
  .ring h3{font-size:12px;line-height:1.25}
  .ring svg{width:74px;height:74px}
  .ring small{font-size:11px}
  .search{width:100%}
  #newBtn,.dgear{display:none}
  .mbrand{display:flex;width:100%;gap:9px;align-items:center}
  .mday{display:inline-flex}
  .mbrand .bmark{width:34px;height:34px;border-radius:11px}.mbrand .bmark svg{width:25px;height:25px}
  .mbrand .bname{font-size:20px}
  .lgrid{grid-template-columns:minmax(0,1fr)}
  .live textarea{min-height:34vh}
  .timer .tt{font-size:38px}

function extenso(v){v=Math.round(v*100);const r=Math.floor(v/100),c=v%100;let s="";
  if(r){const mil=Math.floor(r/1000),rest=r%1000,parts=[];if(mil)parts.push(mil===1?"mil":ext3(mil)+" mil");if(rest)parts.push(ext3(rest));s=parts.join(mil&&rest&&(rest<100||rest%100===0)?" e ":" ")+(r===1?" real":" reais")}
  if(c)s+=(s?" e ":"")+ext3(c)+(c===1?" centavo":" centavos");return s||"zero real"}
function joinDates(ds){if(ds.length===1)return fdateF(ds[0]);const y=ds[ds.length-1].slice(0,4);const l=ds.map(fdateN);return l.slice(0,-1).join(", ")+" e "+l[l.length-1]+"/"+y}
function receiptData(key){
  const i=key.indexOf(":"),k=key.slice(0,i),id=key.slice(i+1);
  if(k==="rec"){const r=S.records.find(x=>x.id===id);if(!r||!r.paid)return null;return {p:P(r.pid),total:+r.value,desc:"atendimento psicológico realizado em "+fdateF(r.date)}}
  const [pid,m]=id.split("|"),p=P(pid);if(!p)return null;const ml=MES[+m.slice(5)-1]+" de "+m.slice(0,4);
  if(k==="mens"){const e=S.monthly[id]||{};if(!e.paid)return null;return {p,total:e.value!=null?+e.value:monthValue(p),desc:"mensalidade de acompanhamento psicológico referente a "+ml}}
  const rs=S.records.filter(r=>r.pid===pid&&r.date.slice(0,7)===m&&charged(r)&&r.paid).sort((a,b)=>a.date.localeCompare(b.date));
  const e=S.monthly[pid+"|"+m]||{};let total=rs.reduce((a,r)=>a+ +r.value,0),parts=[];
  if(rs.length)parts.push((rs.length===1?"atendimento psicológico realizado em ":"atendimentos psicológicos realizados em ")+joinDates(rs.map(r=>r.date)));
  if(isMonthly(p)&&e.paid){total+=e.value!=null?+e.value:monthValue(p);parts.push("mensalidade de acompanhamento psicológico referente a "+ml)}
  if(!total)return null;return {p,total,desc:parts.join("; ")};
}

  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(126,105,119);doc.text("PSICOLOGIA",M,25);
  doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(69,52,63);doc.text(L.title,W-M,18,{align:"right"});
  doc.setFontSize(14);doc.setTextColor(110,75,103);doc.text(L.value,W-M,26,{align:"right"});
  doc.setDrawColor(220,197,206);doc.line(M,31,W-M,31);

  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(126,105,119);if(L.role)doc.text(L.role,W/2,y+10,{align:"center"});

}

function ring(title,p,color,caption){
  const r=44,c=2*Math.PI*r,v=p==null?0:Math.max(0,Math.min(100,p));
  return `<div class="ring"><h3>${title}</h3><svg viewBox="0 0 108 108" role="img" aria-label="${title}: ${p==null?"sem dados":p+"%"}">
  <circle cx="54" cy="54" r="${r}" fill="none" stroke="var(--rail-in)" stroke-width="9"/>
  <circle class="v" style="--c:${c}" cx="54" cy="54" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v/100)}" transform="rotate(-90 54 54)"/>
  <text x="54" y="61" text-anchor="middle" fill="var(--onrail)" font-family="Plus Jakarta Sans,system-ui,sans-serif" font-size="21" font-weight="700">${p==null?"–":p+"%"}</text></svg><small>${caption}</small></div>`;
}
function wRail(){
  const wk=weekDays(),wo=range(wk[0],wk[6]).filter(o=>!CANCEL.includes(o.st)),wd=wo.filter(o=>o.st==="realizada").length;
  const f=monthFin(TODAY().slice(0,7)),tot=f.rec+f.open;
  const past=wk.filter(d=>d<=TODAY());let hn=0;S.habits.forEach(h=>past.forEach(d=>{if((h.days||{})[d])hn++}));const hp=S.habits.length?Math.round(hn/(S.habits.length*past.length)*100):null;
  let h=ring("Sessões da semana",wo.length?Math.round(wd/wo.length*100):null,"var(--rose)",wo.length?`${wd} de ${wo.length} feitas`:"Sem sessões")+

    ring("Rotina",hp,"var(--gold)",S.habits.length?"Hábitos da semana":"Sem hábitos");
  const act=S.patients.filter(p=>p.status==="ativo"),cnt=k=>act.filter(p=>p.freq===k).length;
  const cols={semanal:"var(--rail)",quinzenal:"var(--rose)",mensal:"var(--gold)",avulso:"var(--sage)"};
  h+=`<div class="box"><div class="ph"><h3 style="flex:1">Carteira de pacientes</h3><span class="meta">${plural(act.length,"ativo","ativos")}</span></div>`+
    (act.length?`<div class="mix">${Object.keys(FREQ).map(k=>cnt(k)?`<i style="width:${cnt(k)/act.length*100}%;background:${cols[k]}"></i>`:"").join("")}</div>
    <div class="legend">${Object.keys(FREQ).map(k=>`<span style="--c:${cols[k]}">${FREQ[k][0]}<b>${cnt(k)}</b></span>`).join("")}</div>`:`<p class="hint">Cadastre pacientes para ver a distribuição.</p>`)+`</div>`;
  const bd=S.patients.filter(p=>p.birth&&p.status==="ativo").map(p=>{const b=parse(p.birth),t=parse(TODAY());let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(n<t)n.setFullYear(n.getFullYear()+1);return {p,n,days:Math.round((n-t)/864e5)}}).sort((a,b)=>a.days-b.days).filter(x=>x.days<=30).slice(0,3);
  h+=`<div class="box"><h3>Aniversários de pacientes</h3>`+(bd.length?`<div class="list">${bd.map(x=>`<button class="row" data-pac="${x.p.id}"><span class="bubble num">${x.n.getDate()}</span><span class="txt"><b>${esc(x.p.name)}</b><small>${x.days===0?"É hoje":x.days===1?"Amanhã":"Em "+x.days+" dias"} · ${x.n.getFullYear()-parse(x.p.birth).getFullYear()} anos</small></span></button>`).join("")}</div>`:`<p class="hint">Nenhum nos próximos 30 dias.</p>`)+`</div>`;
  return h;
}

  (S.blocks||[]).forEach(x=>{if(has([x.reason,x.note].join(" ")))add("Bloqueios",`<button data-edit="block:${x.id}"><small>Bloqueio · ${fdate(x.from)} a ${fdate(x.to)}</small>${esc(x.reason||"Bloqueio")}</button>`)});
  NAV.forEach(([k,l])=>{if(has(l))add("Telas",`<button data-go="${k}"><small>Ir para</small>${esc(l)}</button>`)});
  return H;
}
q.addEventListener("input",()=>{
  const H=globalSearch(q.value);if(!q.value.trim()){R.hidden=true;return}
  let last="",h="";H.slice(0,24).forEach(([g,x])=>{if(g!==last){h+=`<p class="rgrp">${g}</p>`;last=g}h+=x});
  R.innerHTML=h||`<div style="padding:10px;color:var(--soft)">Nada encontrado para "${esc(q.value.trim())}".</div>`;R.hidden=false;R.scrollTop=0;
});
const clearSearch=()=>{q.value="";R.hidden=true;R.innerHTML=""};
q.addEventListener("blur",()=>setTimeout(()=>{if(!document.activeElement||!document.activeElement.closest(".search"))clearSearch()},180));
q.addEventListener("keydown",e=>{if(e.key==="Escape"){clearSearch();q.blur()}else if(e.key==="Enter"){const f=R.querySelector("button");if(f){f.click();clearSearch();q.blur()}}});
R.addEventListener("mousedown",e=>e.preventDefault());
R.addEventListener("click",e=>{if(e.target.closest("button"))setTimeout(()=>{clearSearch();q.blur()},0)});
document.addEventListener("click",e=>{if(!e.target.closest(".search")&&q.value)clearSearch()});


document.addEventListener("scroll",e=>{const t=e.target;if(t&&t.dataset&&t.dataset.sk)ui.sk[t.dataset.sk]=[t.scrollTop,t.scrollLeft]},true);
(()=>{let el=null,sx=0,sy=0,sl=0,st=0,moved=false,dragged=false;
  document.addEventListener("mousedown",e=>{if(e.button!==0)return;const c=e.target.closest(".tblscroll,.scrollbox");if(!c||e.target.closest("input,select,textarea"))return;el=c;sx=e.clientX;sy=e.clientY;sl=c.scrollLeft;st=c.scrollTop;moved=false});
  document.addEventListener("mousemove",e=>{if(!el)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.abs(dx)+Math.abs(dy)<6)return;moved=true;el.classList.add("drag");el.scrollLeft=sl-dx;el.scrollTop=st-dy;e.preventDefault()});
  document.addEventListener("mouseup",()=>{if(el){el.classList.remove("drag");if(moved){dragged=true;setTimeout(()=>dragged=false,60)}}el=null});
  document.addEventListener("click",e=>{if(dragged){e.stopPropagation();e.preventDefault();dragged=false}},true);
})();
function saveConfig(){if(!$("#cfName"))return;const v=id=>$("#"+id).value.trim(),sp=x=>x.split(",").map(y=>y.trim()).filter(Boolean);
    S.name=v("cfName")||S.name;S.display=v("cfDisp");S.crp=v("cfCrp");S.cpfProf=v("cfCpf");S.title=v("cfTitle")||"Psicóloga clínica";S.approach=v("cfAppr");
    S.clinic=v("cfClinic")||"Rietz";S.phoneProf=v("cfPhone");S.address=v("cfAddr");S.city=v("cfCity");S.pix=v("cfPix");
    S.workDays=[0,1,2,3,4,5,6].filter(d=>$("#cfWd"+d).checked);
    const ws=v("cfStart")||"08:00",we=v("cfEnd")||"19:00";if(tmin(we)>tmin(ws)){S.workStart=ws;S.workEnd=we}
    S.sessionMin=Math.max(10,+v("cfMin")||50);S.gap=Math.max(0,+v("cfGap")||0);S.chargeMiss=$("#cfMiss").checked;
    S.goalMonth=Math.max(0,+v("cfGoal")||0);S.weekLimit=Math.max(0,+v("cfLimit")||0);S.lockMin=+$("#cfLock").value;
    S.msgCare=$("#cfMsgCare").value.trim()||BLANK().msgCare;S.msgFollow=$("#cfMsgFollow").value.trim()||BLANK().msgFollow;S.msgBlock=$("#cfMsgBlock").value.trim()||BLANK().msgBlock;S.policyMiss=$("#cfPolicy").value.trim()||BLANK().policyMiss;
    S.msgRemind=$("#cfMsgR").value.trim()||BLANK().msgRemind;S.msgCharge=$("#cfMsgC").value.trim()||BLANK().msgCharge;
    const c=sp(v("cfCats"));S.expCats=c.length?c:["Outros"];S.deductCats=sp(v("cfDed"));
    S.theme=$("#cfTheme").value;applyTheme(S.theme);
    ui.keepView=true;dirty=true;lsSet();clearTimeout(tmr);tmr=setTimeout(flush,600);setSync();render();ui.keepView=false;
    const m=$("#cfMsg");if(m){m.textContent="Salvo automaticamente";m.classList.remove("pop");void m.offsetWidth;m.classList.add("pop")}}
let cfT;document.addEventListener("input",e=>{if(e.target.closest("#v-config")&&!/^pin/.test(e.target.id)){clearTimeout(cfT);cfT=setTimeout(saveConfig,500)}});
document.addEventListener("change",e=>{if(e.target.closest("#v-config")&&!/^pin/.test(e.target.id)){clearTimeout(cfT);saveConfig()}});
function applyTheme(t){if(t)document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme")}

const local=lsGet();if(local)S=norm(local);
try{const t0=localStorage.getItem("painel-mi-theme");if(t0&&(!local||local.theme===undefined))S.theme=t0}catch(e){}
try{history.scrollRestoration="manual"}catch(e){}
applyRoute(parseHash(location.hash));
try{history.replaceState({guard:1},"",location.pathname+location.search)}catch(e){try{history.replaceState({guard:1},"")}catch(x){}}hpush();
try{const lv=JSON.parse(localStorage.getItem("painel-mi-live")||"null");if(lv&&lv.date===TODAY())ui.live=lv;else localStorage.removeItem("painel-mi-live")}catch(e){}
window.__acct=acct;

  if(acct.state==="ok"){if(!gateOK){gateOK=true;$("#gate").hidden=true;render();checkLock();toast("Olá, "+firstName(acct.name||S.display||S.name)+"!")}}
  else if(acct.state!=="checking"&&acct.state!=="nocfg"){gateOK=false;renderGate()}else renderGate();
  if($("#acctBox"))$("#acctBox").outerHTML=acctCard();setSync()};
if(window.__acctState)window.__onAcct();else renderGate();
window.addEventListener("online",()=>{setSync();if(dirty&&refMain)flush()});window.addEventListener("offline",setSync);
$("#livePill").onclick=openLive;$("#lockNow").onclick=()=>lockNow();
["pointerdown","keydown","scroll","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},{passive:true,capture:true}));
setInterval(()=>{if(ui.live){tickLive();updatePill()}},1000);
setInterval(()=>{if(S.pin&&unlocked&&+S.lockMin>0&&Date.now()-lastAct>S.lockMin*60000)lockNow("Bloqueado por falta de uso");
  if(ui.view==="hoje"&&$("#scrim").hidden&&$("#live").hidden&&!(document.activeElement&&document.activeElement.matches("input,textarea,select")))render()},30000);
ui.enter=true;render();
(async()=>{
  const db=await window.fbReady;if(!db){mode="local";setSync();return}
  refMain=db.doc("rietz/estado");colRec=db.collection("rietz_registros");mode="cloud";lastSync=Date.now();setSync();
  let gotMain=false,gotRec=false,recs=[],main=null,seeded=false;
  const apply=async()=>{
    if(!gotMain||!gotRec||dirty||writing)return;
    if(main){S=norm(Object.assign({},main,{records:recs}));lsSet()}
    else if(!seeded){seeded=true;
      if(S.tasks.length||S.habits.length||S.notes.length||S.patients.length){dirty=true;flush()}
    }
    render();
  };
  refMain.onSnapshot(snap=>{gotMain=true;main=snap.exists&&snap.data()?snap.data().s:null;apply()},e=>{console.warn(e);mode="local";syncErr=true;setSync();if(e&&e.code==="permission-denied")toast("Esta conta não tem permissão na nuvem.")});
  colRec.onSnapshot(qs=>{gotRec=true;const all=[];lastYears={};qs.docs.forEach(d=>{const l=(d.data()||{}).list||[];lastYears[d.id]=JSON.stringify(l);all.push(...l)});recs=all;apply()},()=>{mode="local";setSync()});
})();
setInterval(()=>{const t=TODAY();if(t!==render._d){render._d=t;render()}},60000);render._d=TODAY();
})();
